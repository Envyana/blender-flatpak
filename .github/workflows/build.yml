name: Build and Publish Blender Flatpak

on:
  workflow_dispatch:
    inputs:
      flatpak_branch:
        description: 'Flatpak branch / versi yang di-publish (contoh: stable, 4.5, 4.3)'
        required: true
        default: 'stable'

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Restore repo lama dari gh-pages supaya versi sebelumnya tetap ada
      - name: Restore existing repo from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Setup repo directory
        run: |
          if [ -d gh-pages-existing ] && [ "$(ls -A gh-pages-existing)" ]; then
            cp -r gh-pages-existing/. repo/
            rm -rf repo/.git
          else
            mkdir -p repo
          fi

      - name: Build Flatpak
        run: |
          flatpak-builder \
            --repo=repo \
            --force-clean \
            --default-branch=${{ github.event.inputs.flatpak_branch }} \
            build-dir \
            io.github.Envyana.Blender.yml

      - name: Update repo summary
        run: flatpak build-update-repo repo

      - name: Generate .flatpakref dan .flatpakrepo
        run: |
          cat > repo/envyana-blender.flatpakref << 'EOF'
          [Flatpak Ref]
          Title=Blender by Envyana
          Name=io.github.Envyana.Blender
          Branch=stable
          Url=https://Envyana.github.io/blender-flatpak
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          EOF

          cat > repo/envyana.flatpakrepo << 'EOF'
          [Flatpak Repo]
          Title=Envyana Blender Repo
          Comment=Custom Blender distribution by Envyana Studio
          Url=https://Envyana.github.io/blender-flatpak
          Homepage=https://github.com/Envyana/blender-flatpak
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          keep_files: true
          enable_jekyll: false
